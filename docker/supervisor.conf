[program:horizon]
process_name=%(program_name)s
command=/usr/local/bin/php -d variables_order=EGPCS /var/www/artisan horizon
user=www-data
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autostart=true
autorestart=true