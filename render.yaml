services:
  - type: web
    name: lenguaje-doctor
    env: docker
    plan: free
    buildCommand: docker-compose -f docker-compose.yml up -d
    startCommand: docker-compose -f docker-compose.yml up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_KEY
        fromDatabase: true
      - key: APP_DEBUG
        value: 'false'
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase: true
      - key: DB_PORT
        fromDatabase: true
      - key: DB_DATABASE
        fromDatabase: true
      - key: DB_USERNAME
        fromDatabase: true
      - key: DB_PASSWORD
        fromDatabase: true

databases:
  - name: your-database-name
    plan: free